# Render Blueprint: describes the API service so it can be created from this repo
# instead of clicking through the dashboard. Render reads this file automatically
# when you choose "New > Blueprint" and point it at the repository.
services:
  - type: web
    name: placementhub-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 1d
      # Generated by Render, so the secret never lives in this repository.
      - key: JWT_SECRET
        generateValue: true
      # Set these two in the Render dashboard after the first deploy:
      #   MONGO_URI   your MongoDB Atlas connection string
      #   CLIENT_URL  the deployed frontend origin, e.g. https://placementhub.vercel.app
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
